:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--blue:#7CC3DD;--green:#8FD1B1;--amber:#E4C47A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px 40px;max-width:520px;margin:auto}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 2px 12px}
h1{font-size:24px;margin:0}small,.mut{color:var(--mut);font-size:12px}
.banner{background:#422006;color:var(--amber);border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{position:relative;text-align:center}.ring svg{width:100%;max-width:140px}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:26px}.ring .v span{font-size:11px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px}.row b{font-size:22px}

.legend{display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--mut)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.nav button{background:var(--card);color:var(--ink);border:0;border-radius:12px;width:44px;height:44px;font-size:20px}
.nav button:disabled{opacity:.3}
.nav .mid{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;position:relative}

 const au=fr.aura||0,pt=(x,b)=>'<circle r="1.3" cx="'+x+'" cy="210"><animate attributeName="cy" values="212;24" dur="5.5s" begin="'+b+'s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;0" dur="5.5s" begin="'+b+'s" repeatCount="indefinite"/></circle>';
 const aura='<g class="au '+st(au)+'" style="--f:'+au.toFixed(2)+'"><circle class="a1" cx="80" cy="122" r="84"/><circle class="a2" cx="80" cy="122" r="75"><animateTransform attributeName="transform" type="rotate" from="0 80 122" to="360 80 122" dur="38s" repeatCount="indefinite"/></circle><ellipse class="a3" cx="80" cy="219" rx="60" ry="6.5"/>'+(au>0?'<g class="pt">'+pt(40,0)+pt(120,1.7)+pt(62,3.1)+pt(100,4.2)+pt(80,2.4)+pt(52,5)+'</g>':'')+(au>0?['0','1.6'].map(b=>'<ellipse class="rp" cx="80" cy="219" rx="10" ry="2"><animate attributeName="rx" values="10;66" dur="3.2s" begin="'+b+'s" repeatCount="indefinite"/><animate attributeName="ry" values="2;7.5" dur="3.2s" begin="'+b+'s" repeatCount="indefinite"/><animate attributeName="opacity" values=".75;0" dur="3.2s" begin="'+b+'s" repeatCount="indefinite"/></ellipse>').join(''):'')+'</g>';
 const scan=lit.length?'<rect class="sc" mask="url(#'+uid+'mk)" x="-8" y="-40" width="176" height="40" fill="url(#'+uid+'sg)"><animate attributeName="y" values="-40;230" dur="'+(full?'2.6':'4.4')+'s" repeatCount="indefinite"/></rect>':'';
 const eyes='<use class="eyes '+((fr.helm||0)>0?'on':'')+'" href="#'+uid+'P_eyes"/>';
 return '<svg viewBox="-8 0 176 230" class="hs'+(full?' full':'')+'" role="img" aria-label="Samurai figure showing weekly progress"><defs>'+defs+mask+'</defs>'+aura+'<g class="fig">'+['legs','blade','armor','helm'].map(piece).join('')+eyes+'</g>'+scan+'</svg>';
}

/* ---- HERO figure: wiring to the app's data ---- */
function heroMetrics(){
 const G=D.goals||{},days=D.days||{},stepG=Math.round((G.steps||10000)*0.8),protG=Math.round((G.protein||156)*0.9);
 let sl=0,pr=0,sp=0;
 for(let i=0;i<7;i++){const x=days[shift(sel,-i)];if(!x)continue;if(x.sleep!=null&&x.sleep>=75)sl++;if(x.protein!=null&&x.protein>=protG)pr++;if(x.steps!=null&&x.steps>=stepG)sp++}
 const from=shift(sel,-6),wk=((D.training||{}).log||[]).filter(e=>e.d>=from&&e.d<=sel&&(e.s==='done'||e.s==='partial')).length;
 const fr={helm:Math.min(1,sl/4),armor:Math.min(1,pr/4),legs:Math.min(1,sp/4),blade:Math.min(1,wk/3)};
 fr.aura=HERO_KEYS.every(k=>fr[k]>=1)?1:HERO_KEYS.reduce((a,k)=>a+fr[k],0)/4*.85;
 return {fr:fr,raw:{sl:sl,pr:pr,sp:sp,wk:wk},th:{stepG:stepG,protG:protG}};
}
function heroRender(){
 const el=document.getElementById('hero'),pn=document.getElementById('forge');if(!el||!pn||!D)return;
 const m=heroMetrics(),q=new URLSearchParams(location.search).get('force');
 if(q){const a=q.split(',').map(Number);['helm','armor','legs','blade','aura'].forEach((k,i)=>{if(isFinite(a[i]))m.fr[k]=a[i]})}
 const n=['helm','armor','legs','blade','aura'].filter(k=>m.fr[k]>=1).length,sig=JSON.stringify(m.fr);
 if(el.dataset.sig!==sig){el.dataset.sig=sig;el.innerHTML=heroSVG(m.fr,'hx')+'<span class="pips" aria-label="'+n+' of 5 forged">'+['helm','armor','legs','blade','aura'].map(k=>'<i class="'+(m.fr[k]>=1?'on':m.fr[k]>0?'half':'')+'"></i>').join('')+'</span>'}
 const r=m.raw,rows=[['Helm','Rest','nights scoring 75+',r.sl,4,'helm'],['Armor','Fuel','days protein '+m.th.protG+' g+',r.pr,4,'armor'],['Legs','Move','days '+m.th.stepG.toLocaleString()+'+ steps',r.sp,4,'legs'],['Blade','Train','workouts',r.wk,3,'blade']];
 pn.innerHTML='<div class="fh"><b>Your character</b><small>last 7 days \u00B7 tap the figure to close</small></div>'
  +rows.map(x=>{const f=m.fr[x[5]],c=HERO_DEF[x[5]].c;return '<div class="fr"><span class="fn"><b>'+x[0]+'</b> '+x[1]+'</span><span class="fb"><i style="width:'+Math.round(f*100)+'%;background:'+c+'"></i></span><span class="fv">'+Math.min(x[3],x[4])+' / '+x[4]+'</span><small>'+x[2]+'</small></div>'}).join('')
  +'<div class="fr"><span class="fn"><b>Aura</b> Balance</span><span class="fb"><i style="width:'+Math.round(m.fr.aura*100)+'%;background:#5aa3b5"></i></span><span class="fv">'+(m.fr.aura>=1?'awake':Math.round(m.fr.aura*100)+'%')+'</span><small>lights fully when all four are forged</small></div>'
  +'<small class="fnote">Pieces dim again as days age out of the 7-day window. Rest days and unlogged days never count against you.</small>';
 el.setAttribute('aria-expanded',String(!pn.hidden));
}
(function(){const b=document.getElementById('hero'),p=document.getElementById('forge');if(b&&p)b.addEventListener('click',()=>{p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))})})();
const __heroV0=view;view=function(){__heroV0.apply(this,arguments);try{heroRender()}catch(e){}};

fetch('api/data?'+Date.now(),{credentials:'same-origin'}).then(r=>r.json()).then(j=>{D=j;if(D.training){applyPending();restoreDraft()}view();if(TS.restored){TS.restored=false;const c=document.querySelector('.tr');c&&c.scrollIntoView({block:'start'})}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
;

(function(){const EM='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="var(--t-track2)" stroke-width="3"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="var(--t-acc)" stroke-width="3" stroke-linecap="round" stroke-dasharray="36 54" transform="rotate(-90 12 12)"/></svg>';
const go=()=>document.querySelectorAll('#app .card h2').forEach(h=>{if(h.querySelector('.k'))return;const s=document.createElement('span');s.className='k';s.innerHTML=EM;h.appendChild(s)});
new MutationObserver(go).observe(document.getElementById('app'),{childList:true});go()})();

/* chart readout: hover (mouse), touch-and-drag (phone), dots, and printed high/low/latest on the weight line */
(function(){
 const SER={weight:{lab:'Weight',unit:' lb',dec:1,col:'var(--t-acc)'},sleep:{lab:'Sleep',unit:'',dec:0,col:'var(--t-acc2)'},readiness:{lab:'Readiness',unit:'',dec:0,col:'var(--t-acc)'}};
 const yp=(v,mn,mx)=>(84-((v-mn)/(mx-mn))*78)/90*100;
 const fd=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
 const hideAll=()=>document.querySelectorAll('.cx .tip,.cx .gd,.cx .hd').forEach(e=>e.style.display='none');
 function attach(svg){
  if(svg.parentNode.classList&&svg.parentNode.classList.contains('cw'))return;
  const win=window.__WIN||[],n=win.length;if(n<2)return;
  const keys=(svg.dataset.s||'').split(',').filter(Boolean);if(!keys.length)return;
  const rng={};keys.forEach(k=>{const v=win.map(x=>x[k]).filter(x=>x!=null);
   rng[k]=k==='weight'?{mn:(v.length?Math.min(...v):0)-.5,mx:(v.length?Math.max(...v):1)+.5}:{mn:50,mx:100}});
  const wrap=document.createElement('div');wrap.className='cw';svg.parentNode.insertBefore(wrap,svg);wrap.appendChild(svg);
  const ov=document.createElement('div');ov.className='cx';wrap.appendChild(ov);
  const gd=document.createElement('div');gd.className='gd';ov.appendChild(gd);
  const tip=document.createElement('div');tip.className='tip';ov.appendChild(tip);
  const hds=keys.map(k=>{const e=document.createElement('div');e.className='hd';e.style.borderColor=SER[k].col;e.style.setProperty('--c',SER[k].col);ov.appendChild(e);return e});
  // persistent dots on every real data point
  keys.forEach(k=>win.forEach((p,i)=>{if(p[k]==null)return;const d=document.createElement('div');d.className='pt';d.style.left=(i/(n-1)*100)+'%';d.style.top=yp(p[k],rng[k].mn,rng[k].mx)+'%';d.style.background=SER[k].col;ov.appendChild(d)}));
  function show(ev){
   const r=wrap.getBoundingClientRect();let f=(ev.clientX-r.left)/r.width;f=Math.max(0,Math.min(1,f));
   let best=-1,bd=9;win.forEach((p,i)=>{if(!keys.some(k=>p[k]!=null))return;const dd=Math.abs(i/(n-1)-f);if(dd<bd){bd=dd;best=i}});
   if(best<0)return;const p=win[best],x=best/(n-1)*100;
   gd.style.display='block';gd.style.left=x+'%';
   keys.forEach((k,j)=>{const h=hds[j];if(p[k]==null){h.style.display='none';return}h.style.display='block';h.style.left=x+'%';h.style.top=yp(p[k],rng[k].mn,rng[k].mx)+'%'});
   tip.innerHTML='<b>'+fd(p.d)+'</b>'+keys.map(k=>p[k]==null?'':'<span><i style="background:'+SER[k].col+'"></i>'+SER[k].lab+' <em>'+Number(p[k]).toFixed(SER[k].dec)+SER[k].unit+'</em></span>').join('');
   tip.style.display='block';const tw=tip.offsetWidth,W=r.width;let left=x/100*W-tw/2;left=Math.max(0,Math.min(W-tw,left));
   tip.style.left=left+'px';tip.style.top='-8px';tip.style.transform='translateY(-100%)';
  }
  wrap.addEventListener('pointerdown',e=>{hideAll();show(e)});
  wrap.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pointerType==='touch'||e.pointerType==='pen')show(e)});
  wrap.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideAll()});
  // keep the day-to-day swipe from firing while a finger is on a chart
  ['touchstart','touchend','touchmove'].forEach(t=>wrap.addEventListener(t,e=>e.stopPropagation(),{passive:true}));
 }
 const run=()=>document.querySelectorAll('#app svg.chart').forEach(attach);
 document.addEventListener('pointerdown',e=>{if(!e.target.closest||!e.target.closest('.cw'))hideAll()});
 new MutationObserver(run).observe(document.getElementById('app'),{childList:true});run();
})();

try{thInit()}catch(e){console.error(e)}
</script></body></html>
