:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--blue:#7CC3DD;--green:#8FD1B1;--amber:#E4C47A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px 40px;max-width:520px;margin:auto}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 2px 12px}
h1{font-size:24px;margin:0}small,.mut{color:var(--mut);font-size:12px}
.banner{background:#422006;color:var(--amber);border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{position:relative;text-align:center}.ring svg{width:100%;max-width:140px}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:26px}.ring .v span{font-size:11px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px}.row b{font-size:22px}
.bar{height:8px;background:#2B343E;border-radius:6px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;border-radius:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat b{font-size:28px;display:block}.chart{width:100%;height:90px}
.legend{display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--mut)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.nav button{background:var(--card);color:var(--ink);border:0;border-radius:12px;width:44px;height:44px;font-size:20px}
.nav button:disabled{opacity:.3}
.nav .mid{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;position:relative}
.nav input{background:var(--card);color:var(--ink);border:0;border-radius:12px;height:44px;padding:0 12px;font:inherit;color-scheme:dark;flex:1;min-width:0;text-align:center}
.nav .today{background:#DCE6F2;color:var(--blue);border-radius:12px;height:44px;width:auto;min-width:68px;padding:0 14px;border:0;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;text-align:center;flex:0 0 auto}
.nav .today:disabled{opacity:.3}
.goal{margin-bottom:14px}.goal:last-child{margin-bottom:0}.bar.big{height:14px;margin:8px 0 6px}.bal{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}.bal b{font-size:34px}.bal span{color:var(--mut)}.bal.def b{color:var(--green)}.bal.sur b{color:var(--amber)}.eq{color:var(--mut);font-size:13px;margin-bottom:10px}:root{--bg:#EAE5DB;--card:#FBF9F5;--ink:#22211E;--mut:#8A8377;--blue:#7CC3DD;--green:#8FD1B1;--amber:#E4C47A}

/* ---- HERO header ---- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
header .hl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
header::before{display:none!important}
header h1{font-size:38px!important;line-height:1.05}
header #upd{margin-top:10px}
.hero{flex:0 0 122px;position:relative;background:none!important;border:0!important;box-shadow:none!important;padding:0;margin:-6px -2px -8px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:2}
.hero svg{display:block;width:122px;height:auto;overflow:visible}
.hero .cap{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font:900 10px/1 'Zen Old Mincho',serif;letter-spacing:.2em;background:#050f15cc;padding:2px 0;color:#e6b88c;text-shadow:1px 1px 0 #000,0 0 6px #c48a6088;pointer-events:none}
.hs .ln,.hs .gw{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round}
.hs .ln{stroke-width:2.3}.hs .gw{stroke-width:5.4;opacity:0}
.hs .pc.off .ln{stroke:#2a5461;stroke-dasharray:2 3.2;opacity:.9}
.hs .pc.part .ln{stroke-dasharray:5 3;opacity:calc(.5 + .5*var(--f));animation:hdash 1.7s linear infinite}
.hs .pc.part .gw{opacity:calc(.12 + .38*var(--f))}
.hs .pc.lit .gw{animation:hpulse 2.6s ease-in-out infinite;animation-delay:var(--d)}
.hs .pc.lit .ln{animation:hline 2.6s ease-in-out infinite;animation-delay:var(--d)}
.hs.full .pc.lit .gw{animation-duration:1.8s}
@keyframes hdash{to{stroke-dashoffset:-16}}
@keyframes hpulse{0%,100%{opacity:.22}50%{opacity:.95}}
@keyframes hline{0%,100%{opacity:.82}50%{opacity:1}}
.hs .eyes{fill:none;stroke:#3b2a30;stroke-width:1.6;stroke-linecap:round}
.hs .eyes.on{stroke:#ff8aa2;animation:hblink 5.5s steps(1) infinite;filter:drop-shadow(0 0 2px #ff8aa2)}
@keyframes hblink{0%,92%,100%{opacity:1}94%,97%{opacity:.15}}
.hs .au .a1,.hs .au .a2,.hs .au .a3{fill:none;stroke:#5aa3b5}
.hs .au .a1{stroke-width:.9;stroke-dasharray:1 7;opacity:.55}.hs .au .a2{stroke-width:.9;stroke-dasharray:38 26 10 48;opacity:.5}.hs .au .a3{stroke-width:1;opacity:.55}

   tip.innerHTML='<b>'+fd(p.d)+'</b>'+keys.map(k=>p[k]==null?'':'<span><i style="background:'+SER[k].col+'"></i>'+SER[k].lab+' <em>'+Number(p[k]).toFixed(SER[k].dec)+SER[k].unit+'</em></span>').join('');
   tip.style.display='block';const tw=tip.offsetWidth,W=r.width;let left=x/100*W-tw/2;left=Math.max(0,Math.min(W-tw,left));
   tip.style.left=left+'px';tip.style.top='-8px';tip.style.transform='translateY(-100%)';
  }
  wrap.addEventListener('pointerdown',e=>{hideAll();show(e)});
  wrap.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pointerType==='touch'||e.pointerType==='pen')show(e)});
