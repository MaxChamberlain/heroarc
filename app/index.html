:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--blue:#7CC3DD;--green:#8FD1B1;--amber:#E4C47A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px 40px;max-width:520px;margin:auto}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 2px 12px}
h1{font-size:24px;margin:0}small,.mut{color:var(--mut);font-size:12px}
.banner{background:#422006;color:var(--amber);border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{position:relative;text-align:center}.ring svg{width:100%;max-width:140px}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:26px}.ring .v span{font-size:11px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px}.row b{font-size:22px}
.bar{height:8px;background:#2B343E;border-radius:6px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;border-radius:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat b{font-size:28px;display:block}.chart{width:100%;height:90px}
.legend{display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--mut)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.nav button{background:var(--card);color:var(--ink);border:0;border-radius:12px;width:44px;height:44px;font-size:20px}
.nav button:disabled{opacity:.3}
.nav .mid{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;position:relative}
.nav input{background:var(--card);color:var(--ink);border:0;border-radius:12px;height:44px;padding:0 12px;font:inherit;color-scheme:dark;flex:1;min-width:0;text-align:center}
.nav .today{background:#DCE6F2;color:var(--blue);border-radius:12px;height:44px;width:auto;min-width:68px;padding:0 14px;border:0;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;text-align:center;flex:0 0 auto}
.nav .today:disabled{opacity:.3}
.goal{margin-bottom:14px}.goal:last-child{margin-bottom:0}.bar.big{height:14px;margin:8px 0 6px}.bal{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}.bal b{font-size:34px}.bal span{color:var(--mut)}.bal.def b{color:var(--green)}.bal.sur b{color:var(--amber)}.eq{color:var(--mut);font-size:13px;margin-bottom:10px}:root{--bg:#EAE5DB;--card:#FBF9F5;--ink:#22211E;--mut:#8A8377;--blue:#7CC3DD;--green:#8FD1B1;--amber:#E4C47A}

</style></head><body>
<header><div><small class="brand">HeroArc</small><small id="date"></small><h1 id="ttl">Today</h1></div><small id="upd"></small></header>
<div class="nav"><button id="prev" aria-label="Previous day">‹</button><div class="mid"><input type="date" id="pick"><button class="today" id="tdy">Today</button></div><button id="next" aria-label="Next day">›</button></div>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const ring=(pct,color,val,lab)=>{const r=52,c=2*Math.PI*r,p=Math.max(0,Math.min(1,pct));return `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#2B343E" stroke-width="9"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 60 60)"/></svg><div class="v"><b>${val}</b><span>${lab}</span></div></div>`};
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${c}"></i></div>`;
const fmt=n=>(n==null?'—':Math.round(n).toLocaleString());
const tm=m=>{if(m==null)return '—';const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');return ((h+11)%12+1)+':'+mm+' '+(h<12?'AM':'PM')};
const has=a=>a.filter(x=>x!=null).length;
const line=(arr,key,color,min,max)=>{const w=300,h=90,n=arr.length;let segs=[],cur=[];arr.forEach((x,i)=>{if(x[key]==null){if(cur.length)segs.push(cur);cur=[]}else cur.push([i*(w/(n-1)),h-6-((x[key]-min)/(max-min))*(h-12)])});if(cur.length)segs.push(cur);return segs.map(s=>s.length>1?`<polyline fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${s.map(p=>p.join(',')).join(' ')}"/>`:`<circle cx="${s[0][0]}" cy="${s[0][1]}" r="3.5" fill="${color}"/>`).join('')};
let D=null,sel=null;
const iso=d=>d.toISOString().slice(0,10);
const shift=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
function view(){
 const T=D.date,days=D.days||{},G=D.goals||{};
 const keys=Object.keys(days).sort(),minD=keys[0]||T;
 if(!sel||sel>T)sel=T; if(sel<minD)sel=minD;
 const isToday=sel===T;
 $('#ttl').textContent=isToday?'Today':new Date(sel+'T12:00').toLocaleDateString(undefined,{weekday:'long'});
 $('#date').textContent=new Date(sel+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'});
 $('#upd').textContent='Updated '+D.updated;
 $('#pick').value=sel;$('#pick').min=minD;$('#pick').max=T;
 $('#prev').disabled=sel<=minD;$('#next').disabled=sel>=T;$('#tdy').disabled=isToday;
 const d=days[sel]||{};
 // today's readiness/sleep may not be synced yet; fall back to the latest scored night and say so
 let r=d.readiness,s=d.sleep,sh=d.sleepHours,hv=d.hrv,bd=d.bed,wk=d.wake,note='';
 if(isToday&&r==null&&s==null&&D.today){r=D.today.readiness;s=D.today.sleep;sh=D.today.sleepHours;hv=D.today.hrv;bd=D.today.bed;wk=D.today.wake;note=D.ouraDay?'<div class="mut" style="margin-top:8px">Latest scored night: '+new Date(D.ouraDay+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</div>':''}
 const st=d.steps??0,ak=d.activeKcal??0,ci=d.kcalIn??0,pr=d.protein??0,sg=G.steps||10000,ag=G.activeKcal||500,kt=G.kcal||2450,pt=G.protein||156;
 const win=[];for(let i=13;i>=0;i--){const k=shift(sel,-i),x=days[k]||{};win.push({d:k,sleep:x.sleep??null,readiness:x.readiness??null,weight:x.weight??null})}
 const w=win.map(x=>x.weight).filter(x=>x!=null),wmin=(w.length?Math.min(...w):0)-.5,wmax=(w.length?Math.max(...w):1)+.5;
 const wt=d.weight;
 window.__WIN=win;$('#app').innerHTML=`
<div class="card"><h2>Health</h2><div class="rings">${ring((r||0)/100,'#c48a60',r??'—','Readiness')}${ring((s||0)/100,'#3c7382',s??'—','Sleep score')}</div>
<div class="row"><span class="mut">Bedtime</span><b style="font-size:17px">${tm(bd)}</b></div><div class="row"><span class="mut">Wake time</span><b style="font-size:17px">${tm(wk)}</b></div><div class="row"><span class="mut">Slept</span><b style="font-size:17px">${sh==null?'—':sh.toFixed(1)+' h'}</b></div><div class="row"><span class="mut">HRV</span><b style="font-size:17px">${hv==null?'—':Math.round(hv)+' ms'}</b></div>${note}</div>
<div class="card"><h2>Weight, 14 days to ${new Date(sel+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</h2><div class="row"><b>${wt==null?'—':wt.toFixed(1)+' lb'}</b><span class="mut">${w.length>1?((w.at(-1)-w[0]>0?'+':'')+(w.at(-1)-w[0]).toFixed(1)+' lb'):'not enough days yet'}</span></div><svg class="chart" data-s="weight" viewBox="0 0 300 90" preserveAspectRatio="none">${line(win,'weight','#c48a60',wmin,wmax)}</svg></div>
<div class="card"><h2>Stress</h2>${(()=>{const sm=d.stressSummary,st=d.stressMin,rc=d.recoverMin;
 if(!sm&&!(st>0)&&!(rc>0))return '<div class="mut">'+(isToday?'Not enough data yet today. Oura scores stress after the day has a few hours of wear.':'No stress data for this day. The ring may not have been worn.')+'</div>';
 const lab={restored:'Restored',normal:'Normal',stressful:'Stressful'}[sm]||'Unscored',col={restored:'var(--green)',normal:'var(--amber)',stressful:'#984a5c'}[sm]||'var(--mut)';
 const tot=(st||0)+(rc||0),sp=tot?Math.round((st||0)/tot*100):0;
 const hm=m=>m==null?'—':(m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m');
 return `<div class="bal"><b style="font-size:30px;color:${col}!important">${lab}</b></div>
 <div class="row"><span class="mut">High stress</span><b style="font-size:17px">${hm(st)}</b></div>
 <div class="row"><span class="mut">High recovery</span><b style="font-size:17px">${hm(rc)}</b></div>
 ${tot?`<div class="bar big" style="margin-top:12px;display:flex;background:var(--green)!important"><i style="width:${sp}%;background:#984a5c;border-radius:999px 0 0 999px"></i></div><small class="mut" style="display:block;margin-top:8px">${sp}% of tracked high-stress/recovery time was stress, ${100-sp}% was recovery</small>`:''}
 <small class="mut" style="display:block;margin-top:10px">Oura counts only periods it classes as clearly stressed or clearly recovering. Most of the day falls in neither, so the minutes are small.</small>`})()}</div>
<div class="card"><h2>Activity</h2><div class="pair"><div class="stat"><span class="mut">Steps</span><b>${d.steps==null?'—':fmt(st)}</b>${bar(st/sg,'var(--blue)')}<small>${d.steps==null?'no data':Math.round(st/sg*100)+'% of '+fmt(sg)}</small></div>
<div class="stat"><span class="mut">Active kcal</span><b>${d.activeKcal==null?'—':fmt(ak)}</b>${bar(ak/ag,'var(--blue)')}<small>${d.activeKcal==null?'no data':Math.round(ak/ag*100)+'% of '+fmt(ag)}</small></div></div></div>
<div class="card"><h2>Nutrition goals</h2>
<div class="goal"><div class="row"><span class="mut">Calories</span><b>${d.kcalIn==null?'—':fmt(ci)}<small style="font-size:12px;color:var(--mut)"> / ${fmt(kt)} kcal</small></b></div><div class="bar big"><i style="width:${Math.min(100,ci/kt*100)}%;background:${ci>kt?'#984a5c':'var(--green)'}"></i></div><small>${d.kcalIn==null?'nothing logged':(ci>kt?fmt(ci-kt)+' kcal over target':fmt(kt-ci)+' kcal left')+' · '+Math.round(ci/kt*100)+'%'}</small></div>
<div class="goal"><div class="row"><span class="mut">Protein</span><b>${d.protein==null?'—':fmt(pr)}<small style="font-size:12px;color:var(--mut)"> / ${fmt(pt)} g</small></b></div><div class="bar big"><i style="width:${Math.min(100,pr/pt*100)}%;background:${pr>=pt?'var(--blue)':'#c48a60'}"></i></div><small>${d.protein==null?'nothing logged':(pr>=pt?'Goal reached ✓':fmt(pt-pr)+' g to go')+' · '+Math.round(pr/pt*100)+'%'}</small></div></div>
<div class="card"><h2>Energy balance</h2>${(()=>{const out=d.totalKcal,inn=d.kcalIn,act=d.activeKcal;
 if(out==null)return '<div class="mut">No calorie-burn data for this day.</div>';
 const rest=act==null?null:out-act;
 const ok=inn!=null&&inn>0, bal=ok?inn-out:null;
 const head=ok?`<div class="bal ${bal<=0?'def':'sur'}"><b>${bal<=0?'−':'+'}${fmt(Math.abs(bal))}</b><span>kcal ${bal<=0?'deficit':'surplus'}</span></div><div class="eq">${fmt(inn)} in − ${fmt(out)} out</div>`:`<div class="bal"><b style="font-weight:300;color:#5E6B79">—</b><span>log food to see balance</span></div><div class="eq">— in − ${fmt(out)} out</div>`;
 // rolling 7-day average over finished days with both numbers
 let n7=0,sum=0;for(let i=1;i<=7;i++){const k=shift(sel,-i),x=days[k];if(x&&x.kcalIn>0&&x.totalKcal!=null){n7++;sum+=x.kcalIn-x.totalKcal}}
 const avg=n7?`<div class="row"><span class="mut">7-day average</span><b style="font-size:17px">${sum/n7<=0?'−':'+'}${fmt(Math.abs(sum/n7))} kcal/day</b></div><small class="mut">${n7} of 7 prior days with food logged</small>`:'';
 return head+`<div class="row"><span class="mut">Resting burn</span><b style="font-size:17px">${rest==null?'—':fmt(rest)}</b></div><div class="row"><span class="mut">Active burn</span><b style="font-size:17px">${act==null?'—':fmt(act)}</b></div><div class="row"><span class="mut">Total out</span><b style="font-size:17px">${fmt(out)}</b></div>${avg}${isToday?'<div class="mut" style="margin-top:8px">Day in progress: resting burn is Oura\'s full-day estimate and active burn is still growing. Food is only what you\'ve logged so far, so the deficit shrinks as you eat.</div>':''}`})()}</div>
<div class="card"><h2>Weekly balance</h2>${(()=>{
 const endD=isToday?shift(sel,-1):sel, L=[];for(let i=6;i>=0;i--)L.push(shift(endD,-i));
 const rows=L.map(k=>{const x=days[k]||{};return {k,bal:(x.kcalIn>0&&x.totalKcal!=null)?x.kcalIn-x.totalKcal:null,w:x.weight??null}});
 const ok=rows.filter(r=>r.bal!=null),n=ok.length,sum=ok.reduce((a,r)=>a+r.bal,0);
 const ws=rows.filter(r=>r.w!=null),wchg=ws.length>1?ws.at(-1).w-ws[0].w:null;
 const f=new Date(L[0]+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}),t=new Date(endD+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
 if(!n)return `<div class="mut">${f} – ${t}</div><div class="bal"><b style="font-weight:300;color:#5E6B79">—</b><span>no days with food logged yet</span></div><div class="mut">Log meals and this fills in: net deficit or surplus for the week, the weight change it predicts, and the weight change you actually saw.</div>`;
 const exp=sum/3500;
 return `<div class="mut">${f} – ${t}${isToday?' (completed days)':''}</div><div class="bal ${sum<=0?'def':'sur'}"><b>${sum<=0?'−':'+'}${fmt(Math.abs(sum))}</b><span>kcal ${sum<=0?'deficit':'surplus'}, ${n} of 7 days logged</span></div>
 <div class="row"><span class="mut">Average per logged day</span><b style="font-size:17px">${sum/n<=0?'−':'+'}${fmt(Math.abs(sum/n))}</b></div>
 <div class="row"><span class="mut">Predicted weight change</span><b style="font-size:17px">${exp<=0?'−':'+'}${Math.abs(exp).toFixed(1)} lb</b></div>
 <div class="row"><span class="mut">Actual weight change</span><b style="font-size:17px">${wchg==null?'—':(wchg>0?'+':wchg<0?'−':'')+Math.abs(wchg).toFixed(1)+' lb'}</b></div>
 <small class="mut">${n<4?'Fewer than 4 logged days, so treat this as rough. ':''}Predicted = net kcal ÷ 3,500. Daily weight swings of 1–3 lb are normal water changes, so judge by trend over a few weeks.</small>`})()}</div>

(function(){const M={health:'健康',weight:'体重',stress:'緊張',activity:'活動',nutrition:'栄養',energy:'収支',weekly:'週間',sleep:'睡眠'};
const go=()=>document.querySelectorAll('#app .card h2').forEach(h=>{if(h.querySelector('.k'))return;const k=M[(h.textContent||'').trim().split(/[ ,]/)[0].toLowerCase()];if(k){const s=document.createElement('span');s.className='k';s.textContent=k;h.appendChild(s)}});
new MutationObserver(go).observe(document.getElementById('app'),{childList:true});go()})();

/* chart readout: hover (mouse), touch-and-drag (phone), dots, and printed high/low/latest on the weight line */
(function(){
 const SER={weight:{lab:'Weight',unit:' lb',dec:1,col:'#c48a60'},sleep:{lab:'Sleep',unit:'',dec:0,col:'#3c7382'},readiness:{lab:'Readiness',unit:'',dec:0,col:'#c48a60'}};
 const yp=(v,mn,mx)=>(84-((v-mn)/(mx-mn))*78)/90*100;
 const fd=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
 const hideAll=()=>document.querySelectorAll('.cx .tip,.cx .gd,.cx .hd').forEach(e=>e.style.display='none');
 function attach(svg){
  if(svg.parentNode.classList&&svg.parentNode.classList.contains('cw'))return;
  const win=window.__WIN||[],n=win.length;if(n<2)return;
  const keys=(svg.dataset.s||'').split(',').filter(Boolean);if(!keys.length)return;
  const rng={};keys.forEach(k=>{const v=win.map(x=>x[k]).filter(x=>x!=null);
   rng[k]=k==='weight'?{mn:(v.length?Math.min(...v):0)-.5,mx:(v.length?Math.max(...v):1)+.5}:{mn:50,mx:100}});
  const wrap=document.createElement('div');wrap.className='cw';svg.parentNode.insertBefore(wrap,svg);wrap.appendChild(svg);
  const ov=document.createElement('div');ov.className='cx';wrap.appendChild(ov);
  const gd=document.createElement('div');gd.className='gd';ov.appendChild(gd);
  const tip=document.createElement('div');tip.className='tip';ov.appendChild(tip);
  const hds=keys.map(k=>{const e=document.createElement('div');e.className='hd';e.style.borderColor=SER[k].col;e.style.setProperty('--c',SER[k].col);ov.appendChild(e);return e});
  // persistent dots on every real data point
  keys.forEach(k=>win.forEach((p,i)=>{if(p[k]==null)return;const d=document.createElement('div');d.className='pt';d.style.left=(i/(n-1)*100)+'%';d.style.top=yp(p[k],rng[k].mn,rng[k].mx)+'%';d.style.background=SER[k].col;ov.appendChild(d)}));
  function show(ev){
   const r=wrap.getBoundingClientRect();let f=(ev.clientX-r.left)/r.width;f=Math.max(0,Math.min(1,f));
   let best=-1,bd=9;win.forEach((p,i)=>{if(!keys.some(k=>p[k]!=null))return;const dd=Math.abs(i/(n-1)-f);if(dd<bd){bd=dd;best=i}});
   if(best<0)return;const p=win[best],x=best/(n-1)*100;
   gd.style.display='block';gd.style.left=x+'%';
   keys.forEach((k,j)=>{const h=hds[j];if(p[k]==null){h.style.display='none';return}h.style.display='block';h.style.left=x+'%';h.style.top=yp(p[k],rng[k].mn,rng[k].mx)+'%'});
   tip.innerHTML='<b>'+fd(p.d)+'</b>'+keys.map(k=>p[k]==null?'':'<span><i style="background:'+SER[k].col+'"></i>'+SER[k].lab+' <em>'+Number(p[k]).toFixed(SER[k].dec)+SER[k].unit+'</em></span>').join('');
   tip.style.display='block';const tw=tip.offsetWidth,W=r.width;let left=x/100*W-tw/2;left=Math.max(0,Math.min(W-tw,left));
   tip.style.left=left+'px';tip.style.top='-8px';tip.style.transform='translateY(-100%)';
  }
  wrap.addEventListener('pointerdown',e=>{hideAll();show(e)});
  wrap.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pointerType==='touch'||e.pointerType==='pen')show(e)});
  wrap.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideAll()});
  // keep the day-to-day swipe from firing while a finger is on a chart
  ['touchstart','touchend','touchmove'].forEach(t=>wrap.addEventListener(t,e=>e.stopPropagation(),{passive:true}));
 }
 const run=()=>document.querySelectorAll('#app svg.chart').forEach(attach);
 document.addEventListener('pointerdown',e=>{if(!e.target.closest||!e.target.closest('.cw'))hideAll()});
 new MutationObserver(run).observe(document.getElementById('app'),{childList:true});run();
})();
</script></body></html>
